name: Generate MAC-SLU grammar

on:
  workflow_dispatch:
  push:
    branches:
      - codex/align-macslu-pipeline-grammar
    paths:
      - .github/workflows/generate-macslu-grammar.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install grammar dependencies
        run: python -m pip install --disable-pip-version-check jieba pypinyin

      - name: Download original MAC-SLU train labels
        run: |
          mkdir -p data/macslu/labels conf
          curl -L --fail --retry 3 \
            'https://huggingface.co/datasets/Gatsby1984/MAC_SLU/resolve/main/label/train_set.jsonl?download=true' \
            -o data/macslu/labels/train_set.jsonl
          test -s data/macslu/labels/train_set.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/macslu/labels/train_set.jsonl')
          count = 0
          for line in path.open(encoding='utf-8'):
              if line.strip():
                  json.loads(line)
                  count += 1
          if count < 10000:
              raise SystemExit(f'Unexpectedly small train set: {count}')
          print(f'Validated {count} train rows')
          PY

      - name: Restore strict grammar generator
        shell: bash
        run: |
          cat > /tmp/macslu_generator.b64 <<'EOF'
          
          EOF
          base64 -d /tmp/macslu_generator.b64 | gzip -d > /tmp/generate_macslu_grammar.py
          python -m py_compile /tmp/generate_macslu_grammar.py

      - name: Generate section-local voice2json grammar
        run: |
          python /tmp/generate_macslu_grammar.py \
            --train-jsonl data/macslu/labels/train_set.jsonl \
            --grammar-out conf/macslu_train_grammar.ini \
            --metadata-out conf/macslu_grammar_metadata.json \
            --stats-out conf/macslu_grammar_stats.json
          python - <<'PY'
          import json
          from pathlib import Path
          stats = json.loads(Path('conf/macslu_grammar_stats.json').read_text(encoding='utf-8'))
          if stats.get('undefined_slot_references') != 0:
              raise SystemExit(stats)
          if stats.get('grammar_patterns', 0) < 1000:
              raise SystemExit(f"Unexpectedly small grammar: {stats}")
          print(json.dumps(stats, ensure_ascii=False, indent=2))
          PY

      - name: Upload generated grammar
        uses: actions/upload-artifact@v4
        with:
          name: macslu-train-grammar
          if-no-files-found: error
          path: |
            conf/macslu_train_grammar.ini
            conf/macslu_grammar_metadata.json
            conf/macslu_grammar_stats.json

      - name: Commit generated files to branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add conf/macslu_train_grammar.ini conf/macslu_grammar_metadata.json conf/macslu_grammar_stats.json
          if ! git diff --cached --quiet; then
            git commit -m 'Generate complete MAC-SLU grammar [skip ci]'
            git push
          fi
